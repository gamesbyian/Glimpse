ions sheet</text><text x="738" y="437" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#153F46" text-anchor="start">Four routes, each 86px tall.</text><text x="738" y="469" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#153F46" text-anchor="start">Focus should be trapped in</text><text x="738" y="500" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#153F46" text-anchor="start">the sheet and restored to</text><text x="738" y="529" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#153F46" text-anchor="start">Sections on close/cancel.</text><text x="738" y="601" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#A5482D" text-anchor="start">NO NATIVE ACCEPTANCE</text><text x="738" y="633" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#566861" text-anchor="start">No proof of TalkBack, real</text><text x="738" y="658" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#566861" text-anchor="start">fontScale=2, dp hitboxes,</text><text x="738" y="683" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#566861" text-anchor="start">insets, or runtime scrolling.</text><text x="738" y="749" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#A5482D" text-anchor="start">UNSELECTED · UNAPPROVED</text></svg>
