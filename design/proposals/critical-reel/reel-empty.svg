<text x="460" y="56" font-family="Arial, sans-serif" font-size="22" fill="#153F46" font-weight="700">GLIMPSE REEL • VISUAL STATE REFERENCE</text>
<text x="460" y="88" font-family="Arial, sans-serif" font-size="19" fill="#1D5960" font-weight="650">EMPTY</text>
<text x="463" y="132" font-family="Arial, sans-serif" font-size="16" fill="#153F46" font-weight="400">Zero photos: empty collection explanation, Add photos and Grid available;</text>
<text x="463" y="156" font-family="Arial, sans-serif" font-size="16" fill="#153F46" font-weight="400">no fabricated thumbnails</text>
<text x="461" y="266" font-family="Arial, sans-serif" font-size="18" fill="#153F46" font-weight="700">STATE CONTRACT</text>
<text x="465" y="298" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Exactly five physical apertures, never a five-photo collection cap</text>
<text x="465" y="335" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Each visible window maps to a real stable photo ID or blank paper</text>
<text x="465" y="372" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Rotating wheel changes preview selection only, not Android wallpaper</text>
<text x="465" y="409" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Index/count drawn from collection, not number of visible apertures</text>
<text x="465" y="446" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Non-loop end state: Next is disabled; Back / Grid remain available</text>
<text x="465" y="483" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Hero image stays stationary while wheel changes beneath it</text>
<text x="465" y="520" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Hit regions must not overlap system navigation or bottom controls</text>
<text x="465" y="557" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="400">• Motion and first-render population require actual-device evidence</text>
<text x="462" y="653" font-family="Arial, sans-serif" font-size="18" fill="#153F46" font-weight="700">SPECIAL EVIDENCE</text>
<text x="463" y="688" font-family="Arial, sans-serif" font-size="14" fill="#153F46" font-weight="500">Add photos CTA lives outside this viewport below.</text>
<text x="465" y="740" font-family="Arial, sans-serif" font-size="14" fill="#667975" font-weight="400">Directional photographic style: design/reference/reel-wide-apertures.png</text>
<text x="463" y="787" font-family="Arial, sans-serif" font-size="14" fill="#667975" font-weight="400">Photos: public research fixtures, not personal user media.</text>
<text x="463" y="846" font-family="Arial, sans-serif" font-size="14" fill="#E8876C" font-weight="700">PROPOSAL · NOT RUNTIME SCREENSHOT OR USER SIGNOFF</text>
