<text x="822" y="166" font-family="Arial,Helvetica,sans-serif" fill="#E8876C" font-size="18" font-weight="700">FORBIDDEN BEHAVIOUR</text>
<text x="465" y="205" font-family="Arial,Helvetica,sans-serif" fill="#153F46" font-size="14" font-weight="400">• Find task-specific help</text>
<text x="465" y="233" font-family="Arial,Helvetica,sans-serif" fill="#153F46" font-size="14" font-weight="400">• Import, preview, apply, shuffle</text>
<text x="465" y="261" font-family="Arial,Helvetica,sans-serif" fill="#153F46" font-size="14" font-weight="400">• Troubleshoot wallpaper timing</text>
<text x="465" y="289" font-family="Arial,Helvetica,sans-serif" fill="#153F46" font-size="14" font-weight="400">• Offline readable basics</text>
