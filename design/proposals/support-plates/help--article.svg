<text x="822" y="233" font-family="Arial,Helvetica,sans-serif" fill="#153F46" font-size="14" font-weight="400">• Reel used as FAQ scroller</text>
<path d="M459 557h667" stroke="#C8B7A1"/>
<text x="465" y="598" font-family="Arial,Helvetica,sans-serif" fill="#1D5960" font-size="18" font-weight="700">STATUS AND SIDE-EFFECT SAFETY</text>
<text x="465" y="628" font-family="Arial,Helvetica,sans-serif" fill="#667975" font-size="14" font-weight="400">No action is implemented by this SVG.</text>
<text x="465" y="654" font-family="Arial,Helvetica,sans-serif" fill="#667975" font-size="14" font-weight="400">An OS handoff is not proof the operation completed.</text>
<text x="465" y="680" font-family="Arial,Helvetica,sans-serif" fill="#667975" font-size="14" font-weight="400">No user photographs or crash details leave this drawing.</text>
<text x="465" y="741" font-family="Arial,Helvetica,sans-serif" fill="#153F46" font-size="14" font-weight="650">Consistent tokens: design/tokens/brand.json</text>
