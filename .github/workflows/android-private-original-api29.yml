name: Glimpse API29 private-original publication

# A Java/Linux hard-link success does not imply Android's untrusted_app SELinux
# profile permits it. Preserve a dedicated oldest-supported-API check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivateOriginalVerifier.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/ImportJournal.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivatePublicationReceiptJournal.kt"
      - ".github/workflows/android-private-original-api29.yml"
      - "app/src/androidTest/java/io/github/gamesbyian/glimpse/data/PrivateOriginalPublicationDeviceTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/glimpse/data/ManualMissingTargetStageResumeDeviceTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/glimpse/data/CrossProcessPublicationDeviceTest.kt"
      - "app/src/debug/java/io/github/gamesbyian/glimpse/debug/PublicationCooperationProbeService.kt"
      - "app/src/debug/AndroidManifest.xml"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PhotoImporter.kt"
      - "app/build.gradle.kts"
  push:
    branches: [main]
    paths:
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivateOriginalVerifier.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/ImportJournal.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivatePublicationReceiptJournal.kt"
      - ".github/workflows/android-private-original-api29.yml"
      - "app/src/androidTest/java/io/github/gamesbyian/glimpse/data/PrivateOriginalPublicationDeviceTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/glimpse/data/ManualMissingTargetStageResumeDeviceTest.kt"
      - "app/src/androidTest/java/io/github/gamesbyian/glimpse/data/CrossProcessPublicationDeviceTest.kt"
      - "app/src/debug/java/io/github/gamesbyian/glimpse/debug/PublicationCooperationProbeService.kt"
      - "app/src/debug/AndroidManifest.xml"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PhotoImporter.kt"
      - "app/build.gradle.kts"
permissions:
  contents: read
concurrency:
  group: glimpse-api29-original-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oldest-supported-api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android compile SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile real app and instrumentation
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Test exclusive, verified private photo publication on API29
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.gamesbyian.glimpse.data.PrivateOriginalPublicationDeviceTest,io.github.gamesbyian.glimpse.data.CrossProcessPublicationDeviceTest,io.github.gamesbyian.glimpse.data.ManualMissingTargetStageResumeDeviceTest
      - name: Preserve API29 actual-device-result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-private-original-api29
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "android-private-original-api29.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-ci-failure-android-private-original-api29
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
