name: Glimpse Android installed-data update acceptance

# Test an old->new APK upgrade with a *temporary one-run* signing identity.
# This does not satisfy owner-controlled stable signing or release signing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/schemas/**"
      - ".github/workflows/android-in-place-upgrade.yml"
      - "scripts/verify-android-in-place-upgrade.py"
      - "app/build.gradle.kts"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/GlimpseDatabase.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PhotoImporter.kt"
      # High-risk commands and alternate original-writing entry points must
      # exercise installed-data preservation, not merely ordinary compilation.
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseModel.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeWidget.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/WallpaperCommands.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/ImportJournal.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivateOriginalVerifier.kt"
      - "app/src/debug/java/io/github/gamesbyian/glimpse/debug/VisualFixtureLauncher.kt"
      - "app/src/main/AndroidManifest.xml"
  push:
    branches: [main]
    paths:
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/schemas/**"
      - ".github/workflows/android-in-place-upgrade.yml"
      - "scripts/verify-android-in-place-upgrade.py"
      - "app/build.gradle.kts"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/GlimpseDatabase.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PhotoImporter.kt"
      # High-risk commands and alternate original-writing entry points must
      # exercise installed-data preservation, not merely ordinary compilation.
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseModel.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeWidget.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/WallpaperCommands.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/ImportJournal.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivateOriginalVerifier.kt"
      - "app/src/main/AndroidManifest.xml"
permissions:
  contents: read
concurrency:
  group: glimpse-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  populated-install-over-update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Prepare Android 37 compilation
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Create isolated one-run signing identity, never publish its key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/glimpse-upgrade-only.p12"
          pass="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$pass"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 \
            -validity 2 -alias upgrade-fixture -storetype PKCS12 \
            -keystore "$store" -storepass "$pass" -keypass "$pass" \
            -dname "CN=Glimpse Disposable Update Test,O=Glimpse CI,C=CA"
          {
            echo "GLIMPSE_CI_DEBUG_KEYSTORE_PATH=$store"
            echo "GLIMPSE_CI_DEBUG_STORE_PASSWORD=$pass"
            echo "GLIMPSE_CI_DEBUG_KEY_ALIAS=upgrade-fixture"
            echo "GLIMPSE_CI_DEBUG_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"
          echo "::notice::One-run test-only signing. Production owner signing still required."
      - name: Build old main/base APK without modifying its source
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PR_BASE"
          if [[ -z "$base" || "$base" == "null" ]]; then base="$PUSH_BEFORE"; fi
          if [[ -z "$base" || "$base" == "null" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          git worktree add --detach "$RUNNER_TEMP/glimpse-upgrade-baseline" "$base"
          (
            cd "$RUNNER_TEMP/glimpse-upgrade-baseline"
            ./gradlew --no-daemon :app:assembleDebug
          )
          cp "$RUNNER_TEMP/glimpse-upgrade-baseline/app/build/outputs/apk/debug/app-debug.apk" \
            "$RUNNER_TEMP/glimpse-before.apk"
      - name: Build candidate with SAME isolated signing identity
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/glimpse-after.apk"
      - name: Prove both certificates match before installation
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          old="$("$signer" verify --print-certs "$RUNNER_TEMP/glimpse-before.apk" |
            sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')"
          new="$("$signer" verify --print-certs "$RUNNER_TEMP/glimpse-after.apk" |
            sed -n 's/.*Signer #1 certificate SHA-256 digest: //p')"
          [[ -n "$old" && "$old" == "$new" ]] || {
            echo "::error::Upgrade fixture signatures differ; abort before touching Android data."
            exit 1
          }
          echo "PASS: public SHA-256 signing certificate identical for both test APKs"
      - name: Enable emulator acceleration
        shell: bash
        run: if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Install populated old app, then update over it without data loss
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Emulator runner executes script fragments separately: argument-bearing
          # command must be a single shell line, not a continued YAML block.
          script: python3 scripts/verify-android-in-place-upgrade.py --old "$RUNNER_TEMP/glimpse-before.apk" --new "$RUNNER_TEMP/glimpse-after.apk" --report artifacts/upgrade-evidence.json
      - name: Retain only aggregate upgrade evidence, never raw images or keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-in-place-upgrade-aggregates
          path: artifacts/upgrade-evidence.json
          retention-days: 14
          if-no-files-found: warn

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "android-in-place-upgrade.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-ci-failure-android-in-place-upgrade
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
