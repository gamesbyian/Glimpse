name: Glimpse incoming Android image share
on:
  pull_request:
    paths:
      - app/src/main/java/io/github/gamesbyian/glimpse/IncomingPhotoShare.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/MainActivity.kt
      - app/src/main/AndroidManifest.xml
      - scripts/capture-incoming-image-share.py
      - .github/workflows/incoming-image-share.yml
  workflow_dispatch:
concurrency:
  group: glimpse-image-share-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  image-share:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android 37
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build APK, JVM tests and harness syntax
        run: |
          python3 -m py_compile scripts/capture-incoming-image-share.py
          ./gradlew --no-daemon :app:assembleDebug
      - name: Allow emulator KVM
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Execute actual share-intent lifecycle and verify original bytes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-incoming-image-share.py --out artifacts/incoming-image-share
      - name: Upload emulator receipt and PNG/XML evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-android-incoming-share-api34
          path: artifacts/incoming-image-share/
          retention-days: 14
          if-no-files-found: warn

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "incoming-image-share.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-ci-failure-incoming-image-share
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
