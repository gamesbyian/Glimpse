name: Production C asset integrity and Android fidelity
on:
  pull_request:
    paths:
      - design/assets/**
      - scripts/validate-agent-c-asset-integrity.py
      - scripts/tests/test_agent_c_asset_integrity.py
      - scripts/capture-agent-c-native.py
      - scripts/validate-agent-c-android-test-results.py
      - app/src/main/**
      - app/src/debug/**
      - app/src/test/java/io/github/gamesbyian/glimpse/domain/AgentCFiniteIdentityTest.kt
      - app/src/androidTest/**
      - app/build.gradle.kts
      - .github/workflows/agent-c-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-c-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run negative proof cases and checked-in JPEG/SVG SHA verifier
        run: |
          python3 -m unittest discover -s scripts/tests -p test_agent_c_asset_integrity.py -v
          python3 scripts/validate-agent-c-asset-integrity.py
      - name: Verify native harness syntax only
        run: python3 -m py_compile scripts/capture-agent-c-native.py scripts/validate-agent-c-android-test-results.py

  native-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: source-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 37 SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Focused native unit tests and actual debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*AgentCFiniteIdentityTest*' :app:assembleDebug
      - name: Grant emulator KVM
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Real MainActivity emulator sweep
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Execute both independent evidence lanes even when one fails.
            # A screenshot assertion must not suppress native test results.
            set +e
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            tests_status=$?
            python3 scripts/capture-agent-c-native.py --out artifacts/agent-c-native
            capture_status=$?
            set -e
            if test "$tests_status" -ne 0 || test "$capture_status" -ne 0; then
              echo "Android instrumented tests=$tests_status, capture=$capture_status" >&2
              exit 1
            fi
      - name: Require complete non-skipped native instrumentation evidence
        if: always()
        run: python3 scripts/validate-agent-c-android-test-results.py
      - name: Preserve native Android JUnit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-agent-c-native-junit-api34
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve real screenshot/hierarchy evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-agent-c-native-real-api34
          path: artifacts/agent-c-native/
          retention-days: 14
          if-no-files-found: warn
