name: Glimpse R04 import recovery | targeted optical proof

# Opt-in five-state source rendering: empty, 17/22, cancel, low storage and offline partial-copy recovery.
on:
  push:
    branches: [agent/visual-state-reconciliation-20261023]
    paths: [.github/workflows/glimpse-audit-r04-import-optical.yml]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: glimpse-r04-optical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r04:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Validate and render 4 actual R04 drafts only
        run: |
          set -euo pipefail
          python3 scripts/validate-audit-cycle.py
          python3 scripts/render-visual-reference-sheets.py --set audit-r04-import-recovery --native --output /tmp/glimpse-r04
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          root=Path("/tmp/glimpse-r04")
          v=json.loads((root/"index.json").read_text())
          images=[]
          for item in v["nativePhoneFiles"]:
              p=Path(item["path"])
              assert p.exists(), p
              im=Image.open(p).convert("RGB")
              assert im.size == (401, 890), (p, im.size)
              assert sum(ImageStat.Stat(im).stddev) > 45, (p, "blank")
              images.append(im)
          assert len(images)==4
          diff=ImageChops.difference(images[0],images[1])
          assert diff.getbbox() is not None, "two unique states required"
          print("R04 4 source-hashed 401x890 draft phone crops and distinct recovery choices PASS")
          PY
      - name: Validate and rasterize one new 17-of-22 offline recovery candidate
        run: |
          python3 scripts/validate-audit-scenario-trace.py
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from cairosvg import svg2png
          from PIL import Image
          path=Path('design/proposals/audit-revisions/r04-import-offline-17-of-22.svg')
          out=Path('/tmp/glimpse-r04')
          svg2png(bytestring=path.read_bytes(),write_to=str(out/'r04-offline-full.png'),
                  output_width=1160,output_height=920)
          with Image.open(out/'r04-offline-full.png') as full:
              phone=full.crop((15,14,416,904)).convert('RGB')
              assert phone.size==(401,890)
              assert len(phone.getcolors(401*890) or [])>100
              phone.save(out/'r04-offline-phone-401x890.png')
          (out/'r04-offline-source-sha256.txt').write_text(
              'SVG source: '+sha256(path.read_bytes()).hexdigest()+'\\n'+
              'PNG pixels: '+sha256((out/'r04-offline-phone-401x890.png').read_bytes()).hexdigest()+'\\n'+
              'Native acceptance: NOT TESTED\\nOwner approved: NO\\n')
          print('PASS: fifth R04 401x890 source SVG raster exists; optical/manual review remains absent')
          PY
      - name: Record machine evidence, not Android/owner acceptance
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "# R04 automated reference evidence"
            echo
            echo "- Source commit: \`$GH_SHA\`"
            echo "- Workflow: https://github.com/gamesbyian/Glimpse/actions/runs/$GH_RUN"
            echo "- Job result: \`$RESULT\`"
            echo "- Expected draft screens: import-cancel, import-no-space, import-empty, import-17-of-22, import-offline-17-of-22"
            echo "- Independent optical review: **NOT automatically performed**"
            echo "- Real Android import transaction: **NOT tested**"
          } > docs/design/r04-targeted-automation-evidence.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/r04-targeted-automation-evidence.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record R04 reference rendering outcome"
            git push origin HEAD:agent/visual-state-reconciliation-20261023
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glimpse-r04-import-recovery-${{ github.sha }}
          path: /tmp/glimpse-r04
          if-no-files-found: warn
          retention-days: 14
