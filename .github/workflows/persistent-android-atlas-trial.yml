name: Glimpse opt-in complete native atlas with persistent UIAutomator

# Explicit research only. The authoritative 46-screen native atlas workflow
# is not modified, skipped, replaced or used as fallback for this experiment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/persistent-android-atlas-trial.yml
      - scripts/capture_atlas_persistent_trial.py
      - scripts/test_capture_atlas_persistent_trial.py
      - scripts/run_persistent_atlas_trial.sh

permissions:
  contents: read

concurrency:
  group: glimpse-persistent-atlas-trial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  persistent-real-android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Validate opt-in XML normalization before provisioning Android
        run: |
          python3 -m py_compile scripts/capture_atlas_persistent_trial.py
          python3 -m unittest discover -s scripts -p 'test_capture_atlas_persistent_trial.py' -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Prepare Android SDK and same-revision debug APK
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          ./gradlew --no-daemon :app:assembleDebug
      - name: Install pin-version research Appium and UiAutomator2 driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "$RUNNER_TEMP/glimpse-appium" --no-audit --no-fund appium@3.8.0
          export APPIUM_HOME="$RUNNER_TEMP/glimpse-appium-home"
          "$RUNNER_TEMP/glimpse-appium/bin/appium" driver install uiautomator2@8.7.3
          "$RUNNER_TEMP/glimpse-appium/bin/appium" driver list --installed
      - name: Enable accelerated Android emulator
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Run complete 46-state real native app, picker and sharesheet atlas
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run_persistent_atlas_trial.sh
      - name: Verify genuine native screenshots, every XML and source SHA
        if: always()
        run: python3 scripts/validate_android_atlas_evidence.py --artifacts artifacts/persistent-android-atlas --expected-sha "$GITHUB_SHA"
      - name: Preserve native evidence and compact experimental transport logs
        if: always()
        shell: bash
        run: |
          if test -f artifacts/persistent-android-atlas/appium-server.log; then
            tail -n 180 artifacts/persistent-android-atlas/appium-server.log > artifacts/persistent-android-atlas/appium-last-180-lines.txt
            rm artifacts/persistent-android-atlas/appium-server.log
          fi
      - name: Upload strictly opt-in Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-optin-persistent-native-atlas
          path: artifacts/persistent-android-atlas/
          retention-days: 2
          if-no-files-found: warn
