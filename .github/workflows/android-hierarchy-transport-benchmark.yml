name: Glimpse opt-in persistent Android hierarchy benchmark

# Research only. Never substitutes for the 46-screen native visual atlas.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-hierarchy-transport-benchmark.yml
      - scripts/benchmark_hierarchy_transport.py
      - scripts/test_benchmark_hierarchy_transport.py

permissions:
  contents: read

concurrency:
  group: glimpse-hierarchy-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-device-benchmark:
    # Do not execute a fork-provided harness inside a native emulator runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Offline transport semantic equivalence tests
        run: |
          python3 -m py_compile scripts/benchmark_hierarchy_transport.py
          python3 -m unittest discover -s scripts -p 'test_benchmark_hierarchy_transport.py' -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Prepare Android SDK 37 and source-matched debug APK
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          ./gradlew --no-daemon :app:assembleDebug
      - name: Install pinned Appium 3 and compatible UiAutomator2 driver (research only)
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --global --prefix "$RUNNER_TEMP/glimpse-appium" --no-audit --no-fund appium@3.8.0
          export APPIUM_HOME="$RUNNER_TEMP/glimpse-appium-home"
          "$RUNNER_TEMP/glimpse-appium/bin/appium" driver install uiautomator2@8.7.3
          "$RUNNER_TEMP/glimpse-appium/bin/appium" driver list --installed
      - name: Enable accelerated emulator
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Benchmark shell dumps against persistent Appium on the same API34 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p artifacts/hierarchy-transport
            export APPIUM_HOME="$RUNNER_TEMP/glimpse-appium-home"
            "$RUNNER_TEMP/glimpse-appium/bin/appium" --address 127.0.0.1 --port 4723 --log-no-colors > artifacts/hierarchy-transport/appium-server.log 2>&1 &
            appium_pid=$!
            trap 'kill "$appium_pid" 2>/dev/null || true' EXIT
            ready=0
            for attempt in $(seq 1 35); do
              if curl --silent --fail "http://127.0.0.1:4723/status" -o /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Pinned Appium service failed readiness within 35 seconds"
              exit 1
            fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/benchmark_hierarchy_transport.py --out artifacts/hierarchy-transport
      - name: Keep compact benchmark report and bounded failure diagnostics
        if: always()
        shell: bash
        run: |
          set -eu
          if test -e artifacts/hierarchy-transport/appium-server.log; then
            tail -n 180 artifacts/hierarchy-transport/appium-server.log > artifacts/hierarchy-transport/appium-last-180-lines.txt
            rm artifacts/hierarchy-transport/appium-server.log
          fi
          if test -f artifacts/hierarchy-transport/hierarchy-benchmark.json; then
            python3 -m json.tool artifacts/hierarchy-transport/hierarchy-benchmark.json
          fi
      - name: Publish opt-in benchmark, not release acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-optin-persistent-uiautomator-research
          path: artifacts/hierarchy-transport/
          retention-days: 2
          if-no-files-found: warn
