name: Glimpse CI contract
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glimpse-ci-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned workflow YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify dispatch, risk coverage and cross-ref cancellation
        run: python3 -m unittest discover -s scripts -p 'test_ci_dispatch.py' -v
