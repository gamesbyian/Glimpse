name: Native Android slice
on:
  workflow_dispatch:
    inputs:
      publish_owner_test_apk:
        description: "Explicitly publish this main build as the current owner-test APK"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android-check.yml"
      - "scripts/verify-reel-material.py"
      - "scripts/verify-reel-typography.py"
      - "scripts/verify-home-widget.py"
      - "scripts/test-paged-contact-sheet-sql.py"
      - "scripts/validate_android_boundaries.py"
      - "scripts/test_validate_android_boundaries.py"
  merge_group:
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android-check.yml"
      - "scripts/verify-reel-material.py"
      - "scripts/verify-reel-typography.py"
      - "scripts/verify-home-widget.py"
      - "scripts/test-paged-contact-sheet-sql.py"
      - "scripts/validate_android_boundaries.py"
      - "scripts/test_validate_android_boundaries.py"
permissions:
  contents: read
# Obsolete commits within one PR may cancel each other. Separate PRs and
# main must not cancel one another's compilation/acceptance evidence.
concurrency:
  # Never cancel an owner-requested publication for a later main push.
  group: glimpse-native-check-${{ github.event_name == 'workflow_dispatch' && 'owner-test' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android 37 SDK
        run: |
          printf "y\\n" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Enforce permanent Android security boundaries
        run: |
          python3 scripts/validate_android_boundaries.py
          python3 -m unittest discover -s scripts -p 'test_validate_android_boundaries.py' -v
      - name: Validate baked paper material geometry
        run: python3 scripts/verify-reel-material.py
      - name: Verify offline licensed font identities
        run: python3 scripts/verify-reel-typography.py
      - name: Verify Home widget lifecycle/action contract
        run: python3 scripts/verify-home-widget.py
      - name: Validate twelve-thousand-row contact-sheet query semantics
        run: python3 scripts/test-paged-contact-sheet-sql.py
      - name: Configure optional stable CI debug signing
        # Never expose the persistent signing key to arbitrary PR contents.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GLIMPSE_CI_SIGNING_KEYSTORE_BASE64: ${{ secrets.GLIMPSE_CI_SIGNING_KEYSTORE_BASE64 }}
          GLIMPSE_CI_SIGNING_STORE_PASSWORD: ${{ secrets.GLIMPSE_CI_SIGNING_STORE_PASSWORD }}
          GLIMPSE_CI_SIGNING_KEY_ALIAS: ${{ secrets.GLIMPSE_CI_SIGNING_KEY_ALIAS }}
          GLIMPSE_CI_SIGNING_KEY_PASSWORD: ${{ secrets.GLIMPSE_CI_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$GLIMPSE_CI_SIGNING_KEYSTORE_BASE64" &&
                -z "$GLIMPSE_CI_SIGNING_STORE_PASSWORD" &&
                -z "$GLIMPSE_CI_SIGNING_KEY_ALIAS" &&
                -z "$GLIMPSE_CI_SIGNING_KEY_PASSWORD" ]]; then
            echo "::warning::No persistent CI signing secret configured. APK uses a per-run debug certificate and cannot be assumed to update prior APKs in place. Never uninstall without protecting app-private images."
          elif [[ -z "$GLIMPSE_CI_SIGNING_KEYSTORE_BASE64" ||
                  -z "$GLIMPSE_CI_SIGNING_STORE_PASSWORD" ||
                  -z "$GLIMPSE_CI_SIGNING_KEY_ALIAS" ||
                  -z "$GLIMPSE_CI_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::CI debug signing is partially configured. All four secrets are required."
            exit 1
          else
            umask 077
            printf '%s' "$GLIMPSE_CI_SIGNING_KEYSTORE_BASE64" |
              base64 --decode > "$RUNNER_TEMP/glimpse-debug-signing.p12"
            echo "GLIMPSE_CI_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/glimpse-debug-signing.p12" >> "$GITHUB_ENV"
            echo "GLIMPSE_CI_DEBUG_STORE_PASSWORD=$GLIMPSE_CI_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "GLIMPSE_CI_DEBUG_KEY_ALIAS=$GLIMPSE_CI_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GLIMPSE_CI_DEBUG_KEY_PASSWORD=$GLIMPSE_CI_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "::notice::Stable CI signing enabled for this build; private key stays out of artifacts."
          fi
      - name: Warn on non-release PR signing
        if: github.event_name == 'pull_request'
        run: echo "::warning::PR debug APK uses ephemeral signing; not a reliable in-place upgrade."
      - name: Compile, test and enforce Android lint in one Gradle invocation
        run: ./gradlew --no-daemon :app:packageGlimpseDebugApk :app:testDebugUnitTest :app:lintDebug
      - name: Retain lint evidence for failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-debug-lint-evidence
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/
          retention-days: 7
          if-no-files-found: warn
      - name: Report public APK certificate fingerprint
        if: success()
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs             app/build/distributions/glimpse-debug.apk |
            grep "Signer #1 certificate SHA-256 digest:" |
            tee app/build/distributions/glimpse-signing-fingerprint.txt
      # Routine CI proves the APK can be packaged but does not store binaries.
      # Only a trusted manual request transfers one APK to the publication job.
      - name: Record checksummed handoff for explicitly requested owner APK
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_owner_test_apk && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          (cd app/build/distributions && sha256sum glimpse-debug.apk > GLIMPSE-BUILD-SHA256.txt)
          cat app/build/distributions/GLIMPSE-BUILD-SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_owner_test_apk && github.ref == 'refs/heads/main'
        with:
          name: glimpse-owner-test-handoff
          path: |
            app/build/distributions/glimpse-debug.apk
            app/build/distributions/glimpse-signing-fingerprint.txt
            app/build/distributions/GLIMPSE-BUILD-SHA256.txt
          retention-days: 1
          if-no-files-found: error

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "android-check.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-ci-failure-android-check
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn

  owner-test-publication:
    # Privileged Release writes are *only* on an explicit manual main dispatch,
    # never on pull_request, push, merge_group or their checkout code.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_owner_test_apk && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glimpse-owner-test-handoff
          path: ${{ runner.temp }}/owner-test-apk
      - name: Verify exact downloaded APK and publish current owner test
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/owner-test-apk"
          sha256sum -c GLIMPSE-BUILD-SHA256.txt
          test -s glimpse-signing-fingerprint.txt
          test "${#SOURCE_SHA}" -eq 40
          current="glimpse-owner-test-${SOURCE_SHA:0:12}"
          if gh release view "$current" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Requested source already published as $current; no replacement"
            exit 1
          fi
          gh release create "$current" \
            glimpse-debug.apk#glimpse-debug.apk \
            GLIMPSE-BUILD-SHA256.txt#GLIMPSE-BUILD-SHA256.txt \
            glimpse-signing-fingerprint.txt#glimpse-signing-fingerprint.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Glimpse owner test build ${SOURCE_SHA:0:12}" --prerelease \
            --notes "Explicitly requested debug test APK for exact main SHA $SOURCE_SHA. Verify SHA256 before installing. Debug signing may change between runs; DO NOT uninstall an installed Glimpse to bypass a signing mismatch because that can destroy app-owned photo data. This build is NOT evidence of safe in-place upgrade or physical-device acceptance."
          gh release view "$current" --repo "$GITHUB_REPOSITORY" >/dev/null
          # Retire only prior releases in this dedicated user-test namespace.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("^glimpse-owner-test-[0-9a-f]{12}$"))) | .tagName' |
          while IFS= read -r obsolete; do
            [ -n "$obsolete" ] || continue
            [ "$obsolete" != "$current" ] || continue
            gh release delete "$obsolete" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          echo "Current explicitly requested owner test release: $current" >> "$GITHUB_STEP_SUMMARY"
