name: Glimpse | B static support text contrast challenge
on:
  push:
    branches: [agent/b-static-contrast-20261025]
    paths:
      - scripts/validate-agent-b-support-contrast.py
      - design/proposals/support-plates/**
      - design/proposals/storyboards/**
      - design/proposals/advanced-storyboards/**
      - .github/workflows/glimpse-agent-b-contrast.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glimpse-b-contrast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  support-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently measure source-author contrast without declaring native proof
        run: |
          mkdir -p /tmp/glimpse-b-contrast
          python3 scripts/validate-agent-b-support-contrast.py --fail-low-contrast --report /tmp/glimpse-b-contrast/static-contrast.json
          python3 scripts/validate-agent-b-support-contrast.py --include-storyboards --report /tmp/glimpse-b-contrast/whole-journey-contrast.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/glimpse-b-contrast/static-contrast.json'))
          assert x['sourceStates']==34 and x['measuredTextElements']>100
          assert x['status']=='UNAPPROVED_STATIC_DESK_AUDIT_NOT_NATIVE'
          print('Source contrast measurements:', x['measuredTextElements'])
          print('AA low contrast:', x['belowAA'], 'Unknown backgrounds:', x['unknownCases'])
          assert x['belowAA']==0 and x['unknownCases']==0
          y=json.load(open('/tmp/glimpse-b-contrast/whole-journey-contrast.json'))
          assert y['sourceStoryboardFrames']==137
          print('137-frame desk audit:', y['measuredTextElements'], 'solid texts;', y['belowAA'], 'low contrast and', y['unknownCases'], 'unresolved')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b-support-contrast-${{ github.sha }}
          path: /tmp/glimpse-b-contrast/
          retention-days: 14
