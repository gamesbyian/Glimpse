name: Glimpse | B static support text contrast challenge
on:
  push:
    branches: [agent/b-static-contrast-20261025]
    paths:
      - scripts/validate-agent-b-support-contrast.py
      - scripts/fix-agent-b-storyboard-contrast.py
      - scripts/render-agent-b-contrast-contact.py
      - scripts/test-agent-b-contrast.py
      - design/proposals/support-plates/**
      - design/proposals/storyboards/**
      - design/proposals/advanced-storyboards/**
      - .github/workflows/glimpse-agent-b-contrast.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: glimpse-b-contrast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  support-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently measure source-author contrast without declaring native proof
        run: |
          mkdir -p /tmp/glimpse-b-contrast
          python3 scripts/test-agent-b-contrast.py
          python3 scripts/fix-agent-b-storyboard-contrast.py --apply > /tmp/glimpse-b-contrast/targeted-edits.json
          python3 scripts/fix-agent-b-storyboard-contrast.py
          python3 scripts/fix-agent-b-storyboard-contrast.py --whole-phone --apply > /tmp/glimpse-b-contrast/whole-phone-targeted-edits.json
          python3 scripts/fix-agent-b-storyboard-contrast.py --whole-phone
          python3 scripts/validate-agent-b-support-contrast.py --fail-low-contrast --report /tmp/glimpse-b-contrast/static-contrast.json
          python3 scripts/validate-agent-b-support-contrast.py --include-storyboards --fail-low-contrast --report /tmp/glimpse-b-contrast/whole-journey-contrast.json
          python3 scripts/validate-agent-b-support-contrast.py --include-storyboards --whole-phone --fail-low-contrast --report /tmp/glimpse-b-contrast/whole-phone-contrast.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/glimpse-b-contrast/static-contrast.json'))
          assert x['sourceStates']==34 and x['measuredTextElements']>100
          assert x['status']=='UNAPPROVED_STATIC_DESK_AUDIT_NOT_NATIVE'
          print('Source contrast measurements:', x['measuredTextElements'])
          print('AA low contrast:', x['belowAA'], 'Unknown backgrounds:', x['unknownCases'])
          assert x['belowAA']==0 and x['unknownCases']==0
          y=json.load(open('/tmp/glimpse-b-contrast/whole-journey-contrast.json'))
          assert y['sourceStoryboardFrames']==137
          assert y['belowAA']==0
          assert y['unknownCases']==0
          print('137-frame desk audit:', y['measuredTextElements'], 'solid texts;', y['belowAA'], 'low contrast and', y['unknownCases'], 'unresolved')
          z=json.load(open('/tmp/glimpse-b-contrast/whole-phone-contrast.json'))
          assert z['wholePhone'] and z['sourceStates']==34 and z['sourceStoryboardFrames']==137
          print('Full phone including headers/nav:',z['measuredTextElements'],'measured;',z['belowAA'],'low contrast;',z['unknownCases'],'unknown')
          assert z['belowAA']==0 and z['unknownCases']==0
          PY
      - name: Directly render six repaired illustrative phone candidates
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 scripts/render-agent-b-contrast-contact.py
          cp /tmp/glimpse-b-contrast/static-contrast.json design/reviews/support-agent-b-2026-10-25/
          cp /tmp/glimpse-b-contrast/whole-journey-contrast.json design/reviews/support-agent-b-2026-10-25/
          cp /tmp/glimpse-b-contrast/whole-phone-contrast.json design/reviews/support-agent-b-2026-10-25/
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('.')
          path=root/'design/reviews/support-agent-b-2026-10-25'
          l=json.loads((path/'contrast-repaired-6-phones.json').read_text())
          assert l['totalPhones']==6 and not any(x['ownerApproved'] or x['nativeVerified'] for x in l['sources'])
          assert hashlib.sha256((path/l['contact']).read_bytes()).hexdigest()==l['contactSHA256']
          assert all(hashlib.sha256((root/x['path']).read_bytes()).hexdigest()==x['sourceSHA256'] for x in l['sources'])
          report=json.loads((path/'whole-journey-contrast.json').read_text())
          assert report['belowAA']==0 and report['sourceStoryboardFrames']==137
          PY
      - name: Preserve source-only contrast repairs on this B branch
        run: |
          git add design/proposals/storyboards/ design/proposals/advanced-storyboards/ design/reviews/support-agent-b-2026-10-25/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            if [ "$(git rev-parse FETCH_HEAD)" != "${GITHUB_SHA}" ]; then
              echo "::error::Ref advanced while correcting. Re-run on current tree; never push stale art."
              exit 1
            fi
            git commit -m "design(B): repair failing storyboard contrast against actual SVG backdrops"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: b-support-contrast-${{ github.sha }}
          path: |
            /tmp/glimpse-b-contrast/
            design/reviews/support-agent-b-2026-10-25/
          retention-days: 14
