name: Validate Glimpse proposal-reference structure
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "design/proposals/**"
      - "design/atlas/**"
      - "design/tokens/brand.json"
      - "docs/design/screen-contract.json"
      - "scripts/validate-visual-spec.py"
      - "scripts/build-visual-proposal-atlas.py"
      - "scripts/validate-storyboard-coverage.py"
      - "scripts/render-storyboard-samples.py"
      - ".github/workflows/visual-reference-check.yml"
  push:
    branches: [main]
    paths:
      - "design/proposals/**"
      - "design/atlas/**"
      - "design/tokens/brand.json"
      - "docs/design/screen-contract.json"
      - "scripts/validate-visual-spec.py"
      - "scripts/build-visual-proposal-atlas.py"
      - "scripts/validate-storyboard-coverage.py"
      - "scripts/render-storyboard-samples.py"
      - ".github/workflows/visual-reference-check.yml"
permissions:
  contents: read
concurrency:
  group: glimpse-reference-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Validate SVG XML and spec coverage without browsers
        run: python3 scripts/validate-visual-spec.py
      - name: Verify all P0 storyboards and scene links
        run: python3 scripts/validate-storyboard-coverage.py
      - name: Build offline and phone-friendly reference gallery
        run: python3 scripts/build-visual-proposal-atlas.py
      - name: Install lightweight offline SVG renderer
        run: python3 -m pip install --disable-pip-version-check --quiet CairoSVG Pillow
      - name: Render P0 storyboard samples for pixel inspection
        run: python3 scripts/render-storyboard-samples.py
      - name: Publish visual reference atlas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-visual-proposals
          path: artifacts/visual-proposal-atlas/
          retention-days: 21
