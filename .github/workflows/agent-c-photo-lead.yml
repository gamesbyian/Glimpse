name: Agent C audit CC0 photo lead
on:
  pull_request:
    paths:
      - scripts/acquire-agent-c-cc0-lead.py
      - .github/workflows/agent-c-photo-lead.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet Pillow==11.3.0
      - name: Acquire explicit Commons CC0 lead for p04 and log verified bytes
        run: python3 scripts/acquire-agent-c-cc0-lead.py
