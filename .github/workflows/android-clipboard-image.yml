name: Glimpse Android clipboard image import
on:
  pull_request:
    paths:
      - app/src/main/java/io/github/gamesbyian/glimpse/ClipboardImageIntake.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/MainActivity.kt
      - app/src/debug/java/io/github/gamesbyian/glimpse/debug/ClipboardImageFixtureLauncher.kt
      - app/src/debug/AndroidManifest.xml
      - scripts/capture-android-clipboard-image.py
      - .github/workflows/android-clipboard-image.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paste-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK 37
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Validate debug build and script
        run: |
          python3 -m py_compile scripts/capture-android-clipboard-image.py
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Allow emulator KVM
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Prove user-tapped Android clipboard image import
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-android-clipboard-image.py --out artifacts/android-clipboard-image
      - name: Preserve actual Android clipboard screenshots and SHA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-android-clipboard-image-api34
          path: artifacts/android-clipboard-image/
          retention-days: 14
          if-no-files-found: warn
