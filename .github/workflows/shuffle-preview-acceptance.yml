name: Glimpse read-only shuffle filmstrip acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseShuffleFilmstrip.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/MainActivity.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/ShuffleProjection.kt"
      - "scripts/capture-android-shuffle-preview.py"
      - ".github/workflows/shuffle-preview-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: glimpse-shuffle-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  filmstrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate native storyboard harness syntax
        run: python3 -m py_compile scripts/capture-android-shuffle-preview.py
      - name: Install Android 37 SDK
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile actual app and pure projection tests
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Allow emulator KVM
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Preview saved source on real Android Home without applying wallpaper
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-android-shuffle-preview.py --out artifacts/android-shuffle-preview
      - name: Upload actual Android filmstrip PNG/XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-android-read-only-shuffle-preview-api34
          path: artifacts/android-shuffle-preview/
          retention-days: 14
          if-no-files-found: warn

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "shuffle-preview-acceptance.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-ci-failure-shuffle-preview-acceptance
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
