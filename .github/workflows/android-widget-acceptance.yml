name: Glimpse real Android Home widget acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeWidget.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/WidgetPreviewDecision.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/WallpaperCommands.kt"
      - "app/src/debug/java/io/github/gamesbyian/glimpse/debug/WidgetHostProbeActivity.kt"
      - "app/src/debug/AndroidManifest.xml"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/layout/glimpse_home_widget.xml"
      - "app/src/main/res/drawable/glimpse_widget_*.xml"
      - "app/src/main/res/xml/glimpse_home_widget_info.xml"
      - "app/src/main/res/values/glimpse_widget_strings.xml"
      - "scripts/capture-android-home-widget.py"
      - "scripts/verify-home-widget.py"
      - ".github/workflows/android-widget-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: glimpse-widget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify widget source and Python capture syntax
        run: |
          python3 scripts/verify-home-widget.py
          python3 -m py_compile scripts/capture-android-home-widget.py
      - name: Install Android 37
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile production widget and regression tests
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM if available
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Host actual app widget, request Home and inspect preview outcome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-android-home-widget.py --out artifacts/android-home-widget
      - name: Upload real hosted widget PNG/XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-real-android-home-widget-api34
          path: artifacts/android-home-widget/
          retention-days: 14
          if-no-files-found: warn

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "android-widget-acceptance.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-ci-failure-android-widget-acceptance
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
