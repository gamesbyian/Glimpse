name: Glimpse | Build complete draft visual evidence atlas

on:
  push:
    branches:
      - agent/visual-state-reconciliation-20261023
    paths:
      - .github/workflows/glimpse-whole-set-evidence-atlas.yml
      - scripts/build-whole-set-evidence-atlas.py
      - design/proposals/canonical-review-spine.v1.json
      - design/proposals/core-state-evidence.v1.json
      - design/proposals/advanced-storyboard-coverage.v1.json
      - design/proposals/storyboard-coverage.v1.json
      - docs/design/screen-contract.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glimpse-evidence-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index-draft-source-evidence:
    if: github.ref == 'refs/heads/agent/visual-state-reconciliation-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest to source traceability
        run: python3 scripts/build-whole-set-evidence-atlas.py --check
      - name: Generate offline browser index and SHA256 evidence manifest
        run: python3 scripts/build-whole-set-evidence-atlas.py
      - name: Verify generated browser links and category counts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('design/atlas/whole-set-evidence-index.json').read_text())
          html=Path('design/atlas/whole-set-evidence-atlas.html').read_text()
          assert d['counts']['baseline']==203 and d['counts']['supplemental']==25
          assert d['counts']['preferredRoute']==39 and d['counts']['namedStateSlots']==34
          assert len({s['path'] for c in d['chapters'] for s in c['items']})==d['counts']['uniqueEvidenceSources']
          assert 'All draft. None owner-approved.' in html
          assert 'source SHA-256' in html or 'Source hashes' in html
          print('PASS: exhaustive evidence index and unapproved-only browser gate')
          PY
      - name: Commit updated reviewer files only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/atlas/whole-set-evidence-atlas.html design/atlas/whole-set-evidence-index.json
          if git diff --cached --quiet; then
            echo "No source changes to generated reviewer files"
            exit 0
          fi
          git commit -m "docs: regenerate exhaustive draft optical evidence atlas"
          git push origin HEAD:"${GITHUB_REF_NAME}"
