name: Glimpse native visual atlas

# Targeted optical inspection, independent of the lean standard build workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Small smoke or full Reel/Grid/text-scale gallery"
        required: true
        default: full
        type: choice
        options: [smoke, full]
  push:
    branches: [main]
    paths:
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/build.gradle.kts"
      - .github/workflows/android-visual-atlas.yml
      - scripts/capture-android-atlas.py
      - app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoSharing.kt
      - app/src/debug/**
      - app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipReader.kt
  pull_request:
    paths:
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/build.gradle.kts"
      - .github/workflows/android-visual-atlas.yml
      - scripts/capture-android-atlas.py
      - app/src/main/java/io/github/gamesbyian/glimpse/MainActivity.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseReelRoom.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeHero.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoSharing.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseGridRoom.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeComponents.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseModel.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/data/GlimpseDatabase.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpsePhotoDetail.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpsePhotoEditor.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipReader.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/domain/CropResolutionAdvisory.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/CircularPhotoReel.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseTypography.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/GlimpseSupportScreen.kt
      - app/src/main/java/io/github/gamesbyian/glimpse/LocalDiagnosticReport.kt
      - app/src/main/res/font/**
      - app/src/main/java/io/github/gamesbyian/glimpse/domain/ReelMotion.kt
      - app/src/main/res/drawable-nodpi/glimpse_paper_reel_face.png

permissions:
  contents: read

concurrency:
  group: glimpse-visual-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_MODE: ${{ github.event_name == 'pull_request' && 'full' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'full') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify capture script syntax
        run: python3 -m py_compile scripts/capture-android-atlas.py
      - name: Install Android SDK 37.0
        shell: bash
        run: |
          set -e
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build actual Glimpse debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Enable KVM for emulator acceleration on ephemeral runner
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::No /dev/kvm available; emulator may be slow"
          fi
      - name: Capture native running screen states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/capture-android-atlas.py --mode "$ATLAS_MODE" --out artifacts/android-visual-atlas
      - name: Upload screenshot gallery and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-android-visual-atlas
          path: artifacts/android-visual-atlas/
          retention-days: 14
          if-no-files-found: warn

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "android-visual-atlas.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glimpse-ci-failure-android-visual-atlas
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
