name: Glimpse Room integrity instrumentation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivateOriginalVerifier.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/ImportJournal.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/WallpaperCommands.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeWidget.kt"
      - ".github/workflows/android-room-integrity.yml"
      - "app/build.gradle.kts"
      - "app/schemas/**"
      - "app/src/androidTest/**"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/GlimpseDatabase.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PhotoImporter.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt"
  push:
    branches: [main]
    paths:
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/src/main/java/io/github/gamesbyian/glimpse/EditedPhotoOutput.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PrivateOriginalVerifier.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/ImportJournal.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/domain/WallpaperCommands.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/GlimpseHomeWidget.kt"
      - ".github/workflows/android-room-integrity.yml"
      - "app/build.gradle.kts"
      - "app/schemas/**"
      - "app/src/androidTest/**"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/GlimpseDatabase.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/PhotoImporter.kt"
      - "app/src/main/java/io/github/gamesbyian/glimpse/data/CollectionZipRestorer.kt"
permissions:
  contents: read
concurrency:
  group: glimpse-room-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile native tests and produce generated Room schema
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify all checked-in Room schema snapshots match KSP output
        shell: bash
        run: |
          set -euo pipefail
          test -s app/schemas/io.github.gamesbyian.glimpse.data.GlimpseDatabase/1.json
          test -s app/schemas/io.github.gamesbyian.glimpse.data.GlimpseDatabase/2.json
          if [[ -n "$(git status --porcelain -- app/schemas/)" ]]; then
            echo "::error::Generated Room schema changed or a new version was not committed."
            git status --short -- app/schemas/
            exit 1
          fi
          echo "PASS: generated Room schema history matches tracked v1 and v2 exactly"
      - name: Publish generated schema for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-room-generated-schema
          path: app/schemas/io.github.gamesbyian.glimpse.data.GlimpseDatabase/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Accelerate emulator
        shell: bash
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Run actual Room DAO integrity tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumentation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-room-integrity-results
          path: app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Record first actionable CI failure without private data
        if: failure()
        run: python3 scripts/ci_failure_digest.py --workflow "android-room-integrity.yml"
      - name: Upload versioned machine-readable failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glimpse-ci-failure-android-room-integrity
          path: artifacts/ci-failure-digest.json
          retention-days: 7
          if-no-files-found: warn
