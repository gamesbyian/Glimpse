name: Glimpse | Publish owner visual review studio
run-name: Glimpse review studio · ${{ github.ref_name }}
on:
  push:
    branches: [agent/visual-state-reconciliation-20261023]
    paths:
      - review/**
      - scripts/test-review-studio.py
      - .github/workflows/glimpse-pages-review.yml
      - design/proposals/whole-product-review-selection.v1.json
      - design/atlas/whole-product-review-snapshot.v1.json
      - design/atlas/whole-set-evidence-index.json
      - scripts/validate-owner-review-readiness.py
      - scripts/validate-integrated-optical-ledger.py
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: glimpse-pages-owner-review
  cancel-in-progress: true
jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-state-reconciliation-20261023
          persist-credentials: false
      - name: Validate source-locked review
        run: |
          python3 scripts/validate-integration-source-freeze.py
          python3 scripts/validate-agent-c-review-selection.py
          python3 scripts/validate-owner-review-readiness.py
          python3 scripts/validate-integrated-optical-ledger.py
          python3 scripts/test-review-studio.py
          node --check review/app.js
      - name: Build complete static Pages directory
        run: |
          mkdir -p _site
          cp -a review design _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Glimpse · Review Studio</title>
          <meta http-equiv="refresh" content="0;url=review/">
          </head><body><p><a href="review/">Open Glimpse visual review studio</a></p></body></html>
          HTML
          python3 - <<'PY'
          import json, pathlib, subprocess
          out=pathlib.Path('_site/review/build.json')
          out.write_text(json.dumps({
              'repository':'gamesbyian/Glimpse',
              'branch':'agent/visual-state-reconciliation-20261023',
              'sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'reviewStatus':'DRAFT_NOT_OWNER_APPROVED',
              'sourceSnapshot':'design/atlas/whole-product-review-snapshot.v1.json',
              'pagesDeployment':'GitHub Actions'
          },indent=2)+'\n')
          assert pathlib.Path('_site/design/proposals/whole-product-review-selection.v1.json').is_file()
          assert pathlib.Path('_site/design/atlas/whole-product-review-snapshot.v1.json').is_file()
          assert pathlib.Path('_site/review/app.js').is_file()
          print('PASS: Pages includes review UI and source-exact draft assets; no approval claims')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy-owner-review:
    needs: build-review
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewer
        id: deployment
        uses: actions/deploy-pages@v4
